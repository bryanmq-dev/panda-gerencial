name: panda-final

# DEMO lista para desplegar: `docker compose up -d --build` y nada más.
#  - Todo corre en la red interna `panda` del proyecto: la base de datos NO se
#    publica al host; las apps hablan con ella por el nombre `db`.
#  - NINGÚN puerto se publica al host. La entrada es el túnel de Cloudflare que ya
#    corre en Docker: conéctelo a la red `panda-internal`
#      docker network connect panda-internal <contenedor-cloudflared>
#    y en Published applications use como servicio:
#      http://panda-ventas:3000     http://panda-gerencial:3000
#  - La base se siembra sola la primera vez (db/00_init.sh: esquema + ~119 mil filas
#    + primera carga del almacén). Para repetir: docker compose down -v
#  - Todas las variables traen valor de demostración; se pueden sobrescribir desde
#    un archivo .env (opcional). Credenciales de demo: cámbielas en producción.
services:
  db:
    build: ./db   # la imagen lleva los scripts de inicio: no se montan desde el repositorio
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panda}
    # sin `ports`: solo accesible desde la red interna
    expose: ["5432"]
    networks: [panda]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # las bases existen recién cuando termina el seeder y la primera carga
      test: ["CMD-SHELL", "psql -U panda -d panda_dw -tAc 'select 1 from ctl.kgi limit 1' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 10s

  ventas:
    build: ./ventas
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://panda:panda@db:5432/panda_oltp
    networks:
      panda:
        aliases: [panda-ventas]
    depends_on:
      db: { condition: service_healthy }

  gerencial:
    build: ./gerencial
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://panda:panda@db:5432/panda_dw
      DATABASE_URL_RO: postgres://gerente_ro:gerente_ro@db:5432/panda_dw
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      # opcional: sin clave el asistente lo avisa y el resto funciona
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      panda:
        aliases: [panda-gerencial]
    depends_on:
      db: { condition: service_healthy }

networks:
  panda:
    name: panda-internal

volumes:
  pgdata:
